name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build in setup-python,
        # so the 3.9 floor runs on 24.04. 3.12 stays on ubuntu-latest, which
        # is also the job that uploads the bundles.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate plugin sources
        run: python -m tools.apkit validate --strict

      - name: Build every target
        run: python -m tools.apkit build --clean

      - name: Run tests
        run: python -m tools.apkit test

      - name: Upload built bundles
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles
          path: dist/
          retention-days: 14

  # The memory plugin's database tests, against a throwaway MongoDB. The check
  # matrix runs everything else without the driver. REQUIRED turns a skip into a
  # failure, so this job cannot pass by testing nothing.
  memory-db:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
    services:
      mongodb:
        image: mongo:8.0.38
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: throwaway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Beside the interpreter, not in it: the setup tests below must run on a Python without the driver.
      - name: Install the driver for the database tests
        run: python -m pip install --target "$RUNNER_TEMP/driver" -r plugins/memory/skills/memory-keeping/scripts/requirements.txt

      - name: Run the database tests
        run: python plugins/memory/tests/test_mongo.py
        env:
          PYTHONPATH: ${{ runner.temp }}/driver
          AI_AGENCY_MEMORY_TEST_URI: mongodb://ci:throwaway@127.0.0.1:27017/?authSource=admin
          AI_AGENCY_MEMORY_TEST_REQUIRED: "1"

      # Setup itself, against the runner's Docker: a container of its own, removed afterwards.
      - name: Run the setup tests against Docker
        run: python plugins/memory/tests/test_setup_docker.py
        env:
          AI_AGENCY_MEMORY_TEST_DOCKER: "1"
          AI_AGENCY_MEMORY_TEST_REQUIRED: "1"

  # Generated files that many branches would each regenerate, so they conflict
  # by construction if branches commit them. Branches leave them alone (see
  # generated-files below); this job regenerates them once, here, after the
  # merge. One job, one push, so two pushes to main never race.
  #   - the marketplace index, from every plugin.json
  #   - the crew diagram, from plugins/, the crew-workflow skill, team.json
  #   - the ticket lifecycle diagram, from create_board.py, plugins/*/commands,
  #     team.json, lifecycle.json
  #   - the skills diagram, from plugins/ (skills, commands, agents, plugin.json),
  #     team.json
  marketplace:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, memory-db]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the marketplace index
        run: python -m tools.apkit marketplace

      - name: Regenerate the crew diagram
        run: python integrations/crew/team_diagram.py

      - name: Regenerate the ticket lifecycle diagram
        run: python integrations/crew/lifecycle_diagram.py

      - name: Regenerate the skills diagram
        run: python integrations/crew/skills_diagram.py

      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=
          if ! git diff --quiet -- .claude-plugin/marketplace.json; then
            git add .claude-plugin/marketplace.json
            git commit -m "chore(marketplace): regenerate index [skip ci]"
            changed=1
          fi
          if ! git diff --quiet -- docs/crew/team.drawio || \
             [ -n "$(git ls-files --others --exclude-standard -- docs/crew/team.drawio)" ]; then
            git add docs/crew/team.drawio
            git commit -m "chore(crew): regenerate crew diagram [skip ci]"
            changed=1
          fi
          if ! git diff --quiet -- docs/crew/lifecycle.drawio || \
             [ -n "$(git ls-files --others --exclude-standard -- docs/crew/lifecycle.drawio)" ]; then
            git add docs/crew/lifecycle.drawio
            git commit -m "chore(crew): regenerate ticket lifecycle diagram [skip ci]"
            changed=1
          fi
          if ! git diff --quiet -- docs/crew/skills.drawio || \
             [ -n "$(git ls-files --others --exclude-standard -- docs/crew/skills.drawio)" ]; then
            git add docs/crew/skills.drawio
            git commit -m "chore(crew): regenerate skills diagram [skip ci]"
            changed=1
          fi
          if [ -z "$changed" ]; then
            echo "generated files already current"
            exit 0
          fi
          git push

  # A branch that commits a CI-generated file brings the conflicts back.
  generated-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch leaves CI-generated files alone
        run: |
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          touched="$(git diff --name-only "$base" HEAD -- docs/crew/team.drawio docs/crew/lifecycle.drawio docs/crew/skills.drawio)"
          if [ -n "$touched" ]; then
            for f in $touched; do
              echo "::error file=$f::CI regenerates this on main after the merge. Drop it from the branch: git checkout origin/${{ github.base_ref }} -- $f (or git rm --cached $f if main does not have it yet)"
            done
            exit 1
          fi
          echo "no generated files touched"

  # marketplace.json entries are git-subdir sources pointing at this branch, so
  # what CI pushes here is what `/plugin install` actually fetches. Single
  # commit, force-pushed: it is build output, it has no history worth keeping.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, memory-db]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH_BRANCH: dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build every target
        run: python -m tools.apkit build --clean

      - name: Force-push the bundles to ${{ env.PUBLISH_BRANCH }}
        working-directory: dist
        run: |
          set -euo pipefail
          test -d claude-code || { echo "no claude-code bundles to publish"; exit 1; }
          git init -q -b "$PUBLISH_BRANCH" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore(dist): build of ${GITHUB_SHA} [skip ci]"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$PUBLISH_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
